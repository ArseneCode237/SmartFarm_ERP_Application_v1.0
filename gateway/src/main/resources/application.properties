spring.application.name=gateway

server.port=8080
server.address=0.0.0.0

# ── Taille max des requêtes / réponses (JSON volumineux avec base64) ─────────
# 50 Mo en octets : accepte des logos / images JPEG encodées en base64.
spring.codec.max-in-memory-size=52428800
spring.cloud.gateway.max-in-memory-size=52428800
server.netty.max-initial-line-length=131072

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1

spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=lb://AUTH
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

spring.cloud.gateway.routes[1].id=organisation
spring.cloud.gateway.routes[1].uri=lb://ORGANISATION
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/organisation/**
spring.cloud.gateway.routes[1].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

spring.cloud.gateway.routes[2].id=animaux
spring.cloud.gateway.routes[2].uri=lb://ANIMAUX
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/animaux/**
spring.cloud.gateway.routes[2].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

spring.cloud.gateway.routes[3].id=stocks-service
spring.cloud.gateway.routes[3].uri=lb://STOCKS
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/stocks/**
spring.cloud.gateway.routes[3].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE


# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=http://localhost:*,http://127.0.0.1:*,http://192.168.1.*:*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
