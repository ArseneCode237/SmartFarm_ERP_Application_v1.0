# ── Database Configuration ───────────────────────────────────────────────────
# Base PostgreSQL utilisee par l'application SmartFarm ERP.
# Les valeurs peuvent etre surchargees via variables d'environnement.
spring.datasource.url=jdbc:postgresql://localhost:5432/ferme_intelligente
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate Configuration ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── URLs inter-services (valeurs par defaut pour le developpement local) ──
services.organisation.url=${SERVICES_ORGANISATION_URL:http://localhost:8082}
services.animaux.url=${SERVICES_ANIMAUX_URL:http://localhost:8083}
services.vaccination.url=${SERVICES_VACCINATION_URL:http://localhost:8084}
services.notifications.url=${SERVICES_NOTIFICATIONS_URL:http://localhost:8086}

# ── JWT Configuration ───────────────────────────────────────────────────────
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# ── Upload fichiers ──────────────────────────────────────────────────────────
app.upload.directory=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Taille max requêtes HTTP (JSON body volumineux : logos base64, etc.) ─────
# -1 = illimité (recommandé en dev). En prod : 50MB par exemple.
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=50MB
server.tomcat.connection-timeout=60s
