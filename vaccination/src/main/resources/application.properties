spring.application.name=vaccination
server.port=8084
server.address=0.0.0.0

# Import des configurations communes (DB, JWT, Upload) depuis le module core
spring.config.import=optional:classpath:common-config.properties

# ── Discovery ─────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=localhost

# ── URLs inter-services ─────────────────────────────────────────────────────
services.organisation.url=http://localhost:8082
services.animaux.url=http://localhost:8083
services.vaccination.url=http://localhost:8084
services.notifications.url=http://localhost:8086
