spring.application.name=stocks
server.port=8085

spring.config.import=optional:classpath:common-config.properties

# ── Discovery ─────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://192.168.1.190:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=192.168.1.190

# ── URLs inter-services (fallback hors Discovery pour OpenFeign/RestTemplate) ──
services.organisation.url=http://192.168.1.190:8082
services.animaux.url=http://192.168.1.190:8083
services.vaccination.url=http://192.168.1.190:8084
services.notifications.url=http://192.168.1.190:8086