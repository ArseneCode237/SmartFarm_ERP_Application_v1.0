# Configuration de test animaux - H2 en memoire avec Dialect SmartFarm
spring.datasource.url=jdbc:h2:mem:testanimaux;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=com.reseau_partage.core.config.SmartFarmH2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desactiver Eureka / Feign en test
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.openfeign.autoconfiguration.enabled=false
